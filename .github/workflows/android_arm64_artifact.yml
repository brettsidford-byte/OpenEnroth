name: Android Release APKs

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.1.13356709
  CCACHE_COMPILERCHECK: content

jobs:
  build_android:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            arch: arm64-v8a
            artifact: OpenEnroth-Android-ARM64
          - name: Universal
            arch: universal
            artifact: OpenEnroth-Android-Universal

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Apply contextual controller mapping changes
        run: python3 portable-patches/apply-contextual-controller-mapping.py

      - name: Configure fast APT mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Install NDK
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION"

      - name: Install universal-build dependencies
        if: matrix.arch == 'universal'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Setup Java
        uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: 17.0.6

      - name: Run ccache
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: android-release-${{ matrix.arch }}
          verbose: 2
          max-size: 800M
          save: true

      - name: Build ${{ matrix.name }} debug APK
        uses: burrunan/gradle-cache-action@v3.0.1
        with:
          build-root-directory: android
          job-id: android-Debug-${{ matrix.arch }}
          arguments: assembleDebug --info -Pandroid.native.buildOutput=verbose
          read-only: false
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          GITHUBARCH: ${{ matrix.arch }}

      - name: Prepare named APK
        run: |
          mkdir -p dist
          cp android/openenroth/build/outputs/apk/debug/openenroth-debug.apk "dist/${{ matrix.artifact }}.apk"
          ls -lh "dist/${{ matrix.artifact }}.apk"

      - name: Upload ${{ matrix.name }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.apk
          if-no-files-found: error
          retention-days: 30
