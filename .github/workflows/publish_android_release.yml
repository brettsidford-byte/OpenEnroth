name: Publish Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.0.1)"
        required: true
        default: "v1.0.1"
      title:
        description: "Release title"
        required: true
        default: "OpenEnroth — Android Handheld Controller Fork v1.0.1"
  push:
    paths:
      - ".github/workflows/publish_android_release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download tested ARM64 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenEnroth-Android-ARM64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 33319677476
          path: release/arm64

      - name: Download tested Universal APK artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenEnroth-Android-Universal
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 33319677476
          path: release/universal

      - name: Prepare release files
        shell: bash
        run: |
          set -euxo pipefail
          ARM64="$(find release/arm64 -type f -name '*.apk' | head -n 1)"
          UNIVERSAL="$(find release/universal -type f -name '*.apk' | head -n 1)"
          test -n "$ARM64"
          test -n "$UNIVERSAL"
          cp "$ARM64" OpenEnroth-Android-ARM64.apk
          cp "$UNIVERSAL" OpenEnroth-Android-Universal.apk
          sha256sum OpenEnroth-Android-ARM64.apk OpenEnroth-Android-Universal.apk > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v1.0.1' }}
          TITLE: ${{ github.event_name == 'workflow_dispatch' && inputs.title || 'OpenEnroth — Android Handheld Controller Fork v1.0.1' }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Android controller update for the OpenEnroth Android Handheld Controller fork.

          This release uses the exact ARM64 and Universal APK artefacts produced successfully by Android Release APKs run 33319677476 from runtime commit e2269290d525de2ac399ba0c65c3455cf8e665a1.

          ## Changes since v1.0.0

          - Gamepad bindings are now separated by active screen context on Android, preventing one physical button from triggering unrelated actions from another UI state.
          - Y now performs Jump during normal gameplay without simultaneously opening Inventory.
          - Context-specific face-button reuse is retained for character, menu and other UI screens.
          - In the in-game menu, A opens the visible Controls/Options entry rather than activating New Game.
          - New Game remains available through the touchscreen; this avoids the unsafe controller path where the normal confirmation prompt could be bypassed.
          - Gameplay A remains the normal Interact/Event Trigger action.
          - All v1.0.0 controller, touchscreen-inspection and Android text-input improvements are retained.

          ## Downloads

          **OpenEnroth-Android-ARM64.apk — Recommended for modern Android handhelds**

          Smaller ARM64-only package. Use this for the Anbernic RG405M and other ARM64 Android retro handhelds.

          **OpenEnroth-Android-Universal.apk — Maximum compatibility**

          Larger package intended for broader Android CPU compatibility.

          `SHA256SUMS.txt` contains checksums for both APKs.

          ## Installation

          OpenEnroth does not include the copyrighted Might and Magic VII game data. A legitimate copy of the original game is still required.

          ## Testing status

          The earlier controller, touchscreen inspection and Android text-input features have been tested successfully on an Anbernic RG405M. This new context-separation change has passed both ARM64 and Universal Android CI builds and is being published for device verification before further controller changes.

          Other SDL-compatible Android handhelds and Bluetooth/USB controllers are expected to work but have not all been individually verified.

          This is a community fork release and is not an official upstream OpenEnroth release.
          EOF

          gh release create "$TAG" \
            OpenEnroth-Android-ARM64.apk \
            OpenEnroth-Android-Universal.apk \
            SHA256SUMS.txt \
            --target e2269290d525de2ac399ba0c65c3455cf8e665a1 \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --latest
